services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: um-core-api
    ports:
      - "8888:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=UMCoreDb;User Id=sa;Password=UmDocker@2026;TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: um-core-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "UmDocker@2026"
    ports:
      - "1435:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - "/bin/bash -c '</dev/tcp/127.0.0.1/1433' >/dev/null 2>&1 || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ← THÊM SERVICE NÀY
  sqlserver-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: um-core-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./version_1.1.sql:/scripts/version_1.1.sql:ro    # ← mount file SQL vào container
    entrypoint: >
      /bin/bash -c "
        echo '=== Running version_1.1.sql ===';
        /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P 'UmDocker@2026' -C -i /scripts/version_1.1.sql;
        echo '=== Done ===';
      "
    restart: "no"

volumes:
  sqlserver_data: