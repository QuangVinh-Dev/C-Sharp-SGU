<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamTalk - Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-layout centered">
        
        <div class="auth-card">
            <div class="auth-header">
                <div class="large-icon">🔐</div>
                <h2>Forgot your password?</h2>
                <p>Enter your work email and we’ll send you a secure password reset link.</p>
            </div>
            
            <form id="forgotForm">
                <div class="form-group">
                    <label for="email" class="form-label">Work Email</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your work email">
                </div>
                
                <p style="font-size:13px; color:var(--muted); text-align:center; margin-bottom:24px;">
                    Reset links expire after 15 minutes.
                </p>
                
                <button type="submit" class="btn btn-primary">Send Reset Link</button>
            </form>
            
            <div class="auth-footer">
                <a href="login.html">Back to Login</a>
            </div>
        </div>
        
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
